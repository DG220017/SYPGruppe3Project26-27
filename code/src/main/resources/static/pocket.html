    .brand-note { font-size: 11px; margin: 13px 0 47px; }
    nav { display: grid; gap: 9px; }

    .preferences { display: flex; gap: 13px; flex-wrap: wrap; }

    .preferences select { font-size: 12px; padding: 9px; }

    .dot { width: 6px; height: 6px; background: currentColor; border-radius: 50%; }
    .heading { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 25px; }
    .heading p { margin-bottom: 0; }
    .primary { background: var(--accent); color: var(--surface); border-color: var(--accent); font-weight: bold; }
    .overview { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 18px; margin-bottom: 25px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px; }
    .balance { position: relative; overflow: hidden; background: linear-gradient(120deg, var(--hero), var(--hero-end)); color: #fff; border: 0; min-height: 200px; }
    .balance::after { content: ''; position: absolute; width: 175px; height: 175px; border: 32px solid #ffffff09; border-radius: 50%; right: -65px; bottom: -80px; pointer-events: none; }
    .balance .muted { color: #d6d2e5; }

    .stat-icon { display: inline-grid; place-items: center; height: 33px; width: 33px; border-radius: 10px; background: var(--soft); margin-right: 8px; font-size: 19px; }
    .positive { color: var(--green); }
    .negative { color: var(--red); }
    .columns { display: grid; grid-template-columns: minmax(0, 1.9fr) minmax(250px, 1fr); gap: 22px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .section-head h2 { margin-bottom: 0; }
    .link { color: var(--accent); border: 0; background: none; padding: 6px; font-size: 12px; font-weight: bold; }
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; text-align: left; white-space: nowrap; }
    th { font-size: 11px; color: var(--muted); font-weight: normal; padding: 10px 12px 14px; }
    td { border-top: 1px solid var(--line); padding: 17px 12px; font-size: 13px; }
    th:first-child, td:first-child { padding-left: 0; }
    th:last-child, td:last-child { text-align: right; padding-right: 0; }
    td strong { display: block; font-size: 13px; margin-bottom: 4px; }
    .account { display: flex; justify-content: space-between; gap: 12px; padding: 19px 0; border-bottom: 1px solid var(--line); }
    .account:last-child { border-bottom: 0; }
    .account-name { display: flex; align-items: center; gap: 11px; }
    .account-icon { display: grid; place-items: center; width: 37px; height: 37px; border-radius: 12px; background: var(--soft); color: var(--accent); }
    .account small { display: block; color: var(--muted); margin-top: 5px; }
    .mini-note { padding-top: 20px; margin-top: 17px; border-top: 1px solid var(--line); font-size: 12px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
    .toolbar label { display: grid; gap: 7px; font-size: 12px; color: var(--muted); }
    .toolbar .search-label { flex: 1; min-width: 160px; }
    .delete { color: var(--red); font-size: 12px; padding: 7px 10px; }
    .empty { padding: 35px; text-align: center; color: var(--muted); }
    footer { display: flex; justify-content: space-between; gap: 15px; font-size: 11px; color: var(--muted); margin-top: 30px; }
    #notice { color: var(--text); padding: 12px 16px; border: 1px solid var(--accent); border-radius: 10px; margin-bottom: 20px; background: var(--soft); }
    dialog { width: min(460px, 92vw); max-height: 90vh; overflow: auto; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); color: var(--text); padding: 28px; }

    </section>
    <section id="management" class="card" hidden>
      <div class="toolbar">
        <label class="search-label"><span data-i18n="search"></span><input id="search" type="search" onkeydown="if(event.key === 'Enter') searchBackend()"></label>
        <label><span data-i18n="searchBy"></span><select id="searchKey"></select></label>
        <button onclick="searchBackend()" data-i18n="searchButton" style="align-self:end"></button>
        <label id="typeLabel"><span data-i18n="type"></span><select id="typeFilter" onchange="searchBackend(true)"><option value="" data-i18n="all"></option><option value="INCOME" data-i18n="income"></option><option value="EXPENSE" data-i18n="expenses"></option></select></label>

      </div>
      <div class="table-wrap" id="mainTable"></div>
    </section>
    <footer><span class="badge"><span class="dot"></span><span id="modeLabel"></span></span><span id="modeNote"></span></footer>
  </main>
</div>
<dialog id="entryDialog" aria-labelledby="formTitle">

      balance: 'Solde total', allAccounts: 'Somme des soldes des comptes · EUR', income: 'Revenus', expenses: 'Dépenses', allEntries: 'Toutes les transactions chargées', recent: 'Dernières entrées', viewAll: 'Tout voir →', yourAccounts: 'Vos comptes', manage: 'Gérer →',
      search: 'Valeur recherchée', type: 'Type', all: 'Tous les types', reload: 'Recharger',
      name: 'Nom', email: 'E-mail', amount: 'Montant', action: 'Action', id: 'ID', cancel: 'Annuler', save: 'Enregistrer', remove: 'Supprimer',
      addAccounts: '+ Compte', addTransactions: '+ Transaction', addUsers: '+ Utilisateur', empty: 'Aucune entrée trouvée.', live: 'Spring Boot',
      liveNote: 'Données de votre application Spring Boot.', confirm: 'Voulez-vous supprimer cette entrée ?', saved: 'Entrée enregistrée.', removed: 'Entrée supprimée.', loaded: 'Données rechargées.',
      failed: 'Échec de la requête. Vérifiez le serveur, les contrôleurs et les champs des entités.', invalid: 'Vérifiez les données saisies.', transactionHint: 'Saisissez un montant positif. Le type détermine un revenu ou une dépense.', liveHint: 'Ce changement sera envoyé à Spring Boot.'
    }
  };

  function t(key) { return translations[language][key]; }
  function money(value) { return new Intl.NumberFormat(language, { style: 'currency', currency: 'EUR' }).format(value); }

  // Benutzereingaben dürfen nicht als HTML ausgeführt werden.
  function escapeHtml(value) {
    return String(value).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#39;');
  }

  function setLanguage(value) {
    language = value;
    document.documentElement.lang = value;
    document.title = 'Pocket · ' + t('tagline');
    document.querySelectorAll('[data-i18n]').forEach(function(element) {
      element.textContent = t(element.dataset.i18n);
    });
    document.getElementById('modeLabel').textContent = t('live');
    document.getElementById('modeNote').textContent = t('liveNote');
    document.getElementById('notice').hidden = true;
    showPage(page);
    remember('pocketLanguage', value);
  }

  function setTheme(value) {
    document.body.dataset.theme = value;
    remember('pocketTheme', value);
  }

  function remember(key, value) {
    try { localStorage.setItem(key, value); } catch (error) { /* Bei blockiertem Speicher bleibt die Oberfläche nutzbar. */ }
  }

  function addLabel(kind) {
    if (kind === 'accounts') return t('addAccounts');
    if (kind === 'users') return t('addUsers');
    return t('addTransactions');
  }

  function showPage(value) {
    page = value;
    filteredRows = null;
    document.querySelectorAll('[data-page]').forEach(function(button) {
      button.classList.toggle('active', button.dataset.page === page);
      if (button.dataset.page === page) button.setAttribute('aria-current', 'page');
      else button.removeAttribute('aria-current');
    });
    const overview = page === 'dashboard';
    document.getElementById('dashboard').hidden = !overview;
    document.getElementById('management').hidden = overview;
    document.getElementById('pageTitle').textContent = t(overview ? 'welcome' : page);
    const subtitles = { dashboard: 'subtitle', accounts: 'accountSub', transactions: 'transactionSub', users: 'userSub' };
    document.getElementById('pageSubtitle').textContent = t(subtitles[page]);
    document.getElementById('addButton').textContent = addLabel(page);
    document.getElementById('search').value = '';
    document.getElementById('typeFilter').value = '';
    document.getElementById('typeLabel').hidden = page !== 'transactions';
    const keys = page === 'accounts' ? ['id'] : page === 'users' ? ['id', 'email'] : ['id', 'name'];
    document.getElementById('searchKey').innerHTML = keys.map(function(key) { return '<option value="' + key + '">' + t(key) + '</option>'; }).join('');
    render();
  }

  function render() {
    let balance = 0, income = 0, expenses = 0;
    data.accounts.forEach(function(account) { balance += Number(account.balance); });
    data.transactions.forEach(function(transaction) {
      if (transaction.type === 'INCOME') income += Number(transaction.amount);
      if (transaction.type === 'EXPENSE') expenses += Number(transaction.amount);
    });
    document.getElementById('totalBalance').textContent = !hasLoaded ? '—' : money(balance);
    document.getElementById('totalIncome').textContent = !hasLoaded ? '—' : money(income);
    document.getElementById('totalExpenses').textContent = !hasLoaded ? '—' : money(expenses);
    document.getElementById('recentTable').innerHTML = makeTable('transactions', data.transactions.slice(0, 5), false);
    let cards = '';
    data.accounts.forEach(function(account) {
      cards += '<div class="account"><div class="account-name"><span class="account-icon" aria-hidden="true">▣</span><div><strong>' + escapeHtml(account.name) + '</strong><small>ID ' + escapeHtml(account.id) + '</small></div></div><strong>' + money(account.balance) + '</strong></div>';
    });
    document.getElementById('accountCards').innerHTML = cards || '<p class="empty">' + t('empty') + '</p>';
    if (page !== 'dashboard') renderTable();
  }

  function renderTable() {
    document.getElementById('mainTable').innerHTML = makeTable(page, filteredRows || data[page], true);
  }

  async function searchBackend(byType = false) {
    if (busy || page === 'dashboard') return;
    const kind = page;
    const key = document.getElementById('searchKey').value;
    const query = document.getElementById('search').value.trim();
    const type = document.getElementById('typeFilter').value;
    const searches = {
      accounts: { id: '/getAccountbyId' },
      transactions: { id: '/api/transactions/findTransactionbyID', name: '/api/transactions/findTransactionbyName' },
      users: { id: '/api/users/findUserbyId', email: '/api/users/findUserbyEmail' }
    };
    let path = endpoints[kind].list;
    if (byType && type) {
      path = '/api/transactions/findAllTransactionsbyType?type=' + encodeURIComponent(type);
      document.getElementById('search').value = '';
    } else if (!byType && query) {
      path = searches[kind][key] + '?' + key + '=' + encodeURIComponent(query);
      document.getElementById('typeFilter').value = '';
    }
    setBusy(true);
    try {
      const result = await request(path);
      const rows = result == null ? [] : Array.isArray(result) ? result : [result];
      validateRows(kind, rows);
      if (page === kind) { filteredRows = rows; renderTable(); }
    } catch (error) { notify(t('failed') + ' ' + error.message); }
    finally { setBusy(false); }
  }

  function makeTable(kind, rows, actions) {
    if (rows.length === 0) return '<p class="empty">' + t('empty') + '</p>';
    let html = '<table><thead><tr><th>' + t('name') + ' / ID</th>';
    if (kind === 'transactions') html += '<th>' + t('type') + '</th>';
    html += '<th>' + t(kind === 'users' ? 'email' : kind === 'accounts' ? 'balance' : 'amount') + '</th>';
    if (actions) html += '<th>' + t('action') + '</th>';
    html += '</tr></thead><tbody>';
    rows.forEach(function(item) {
      html += '<tr><td><strong>' + escapeHtml(item.name) + '</strong><small class="muted">#' + escapeHtml(item.id) + '</small></td>';
      if (kind === 'transactions') {
        const incoming = item.type === 'INCOME';
        html += '<td><span class="badge">' + t(incoming ? 'income' : 'expenses') + '</span></td><td class="' + (incoming ? 'positive' : 'negative') + '">' + (incoming ? '+' : '−') + money(item.amount) + '</td>';
      } else {
        html += '<td>' + (kind === 'users' ? escapeHtml(item.email) : money(item.balance)) + '</td>';
      }
      if (actions) html += '<td><button class="delete" onclick="removeEntry(' + rows.indexOf(item) + ')" ' + (busy ? 'disabled' : '') + '>' + t('remove') + '</button></td>';
      html += '</tr>';
    });
    return html + '</tbody></table>';
  }

  function openForm() {
    formPage = page === 'dashboard' ? 'transactions' : page;
    document.getElementById('entryForm').reset();
    document.getElementById('formTitle').textContent = addLabel(formPage);
    const user = formPage === 'users';
    const transaction = formPage === 'transactions';
    document.getElementById('emailLabel').hidden = !user;
    document.getElementById('entryEmail').required = user;
    document.getElementById('entryEmail').disabled = !user;
    document.getElementById('amountLabel').hidden = user;
    document.getElementById('entryAmount').required = !user;
    document.getElementById('entryAmount').disabled = user;
    document.getElementById('entryAmount').min = transaction ? '0.01' : '-999999999';
    document.getElementById('amountCaption').textContent = t(transaction ? 'amount' : 'balance') + ' (EUR)';
    document.getElementById('entryTypeLabel').hidden = !transaction;
    document.getElementById('formHint').textContent = (transaction ? t('transactionHint') + ' ' : '') + t('liveHint');
    document.getElementById('entryDialog').showModal();
  }

  function setBusy(value) {
    busy = value;
    document.getElementById('saveButton').disabled = value;
    document.getElementById('addButton').disabled = value;
    document.querySelectorAll('.delete').forEach(function(button) { button.disabled = value; });
  }

  async function saveEntry(event) {
    event.preventDefault();
    if (busy) return;
    const item = { name: document.getElementById('entryName').value.trim() };
    if (!item.name) { document.getElementById('entryName').focus(); return; }
    if (formPage === 'users') item.email = document.getElementById('entryEmail').value.trim();
    if (formPage === 'accounts') item.balance = Number(document.getElementById('entryAmount').value);
    if (formPage === 'transactions') {
      item.amount = Number(document.getElementById('entryAmount').value);
      item.type = document.getElementById('entryType').value;
    }
    setBusy(true);
    try {
      await request(endpoints[formPage].add, 'POST', item);
      document.getElementById('entryDialog').close();
      try { await refreshData(); notify(t('saved')); }
      catch (error) { notify(t('refreshFailed') + ' ' + error.message); }
    } catch (error) {
      document.getElementById('entryDialog').close();
      notify(t('failed') + ' ' + error.message);
    } finally { setBusy(false); }
  }

  async function removeEntry(index) {
    if (busy || !confirm(t('confirm'))) return;
    const kind = page;
    const item = (filteredRows || data[kind])[index];
    setBusy(true);
    try {
      await request(endpoints[kind].remove, 'DELETE', item);
      try { await refreshData(); notify(t('removed')); }
      catch (error) { notify(t('refreshFailed') + ' ' + error.message); }
    } catch (error) { notify(t('failed') + ' ' + error.message); }
    finally { setBusy(false); }
  }

  // fetch sendet JSON an die vorhandenen Spring-Boot-Adressen.
  async function request(path, method = 'GET', body = null) {
    const options = { method: method, headers: { 'Accept': 'application/json' } };
    if (body !== null) {
      options.headers['Content-Type'] = 'application/json';
      options.body = JSON.stringify(body);
    }
    const response = await fetch(API_BASE + path, options);
    if (!response.ok) throw new Error('HTTP ' + response.status);
    if (method !== 'GET') return null;
    const text = await response.text();
    return text.trim() ? JSON.parse(text) : null;
  }

  function validateRows(kind, rows) {
    if (!Array.isArray(rows)) throw new Error('JSON: ' + kind);
    rows.forEach(function(row) {
      if (!row || row.id == null || typeof row.name !== 'string') throw new Error('JSON: id / name');
      if (kind === 'users' && typeof row.email !== 'string') throw new Error('JSON: email');
      if (kind === 'accounts' && (typeof row.balance !== 'number' || !Number.isFinite(row.balance))) throw new Error('JSON: balance');
      if (kind === 'transactions' && (typeof row.amount !== 'number' || !Number.isFinite(row.amount) || row.amount <= 0 || !['INCOME', 'EXPENSE'].includes(row.type))) throw new Error('JSON: amount / type');
    });
  }

  async function refreshData() {
    const next = {};
    for (const kind of ['accounts', 'transactions', 'users']) {
      next[kind] = await request(endpoints[kind].list);
      validateRows(kind, next[kind]);
    }
    data = next;
    hasLoaded = true;
    filteredRows = null;
    document.getElementById('search').value = '';
    document.getElementById('typeFilter').value = '';
    render();
  }

  async function loadData() {
    if (busy) return;
    setBusy(true);
    try { await refreshData(); notify(t('loaded')); }
    catch (error) { notify(t('failed') + ' ' + error.message); }
    finally { setBusy(false); }
  }

  function notify(message) {
    document.getElementById('notice').textContent = message;
    document.getElementById('notice').hidden = false;
  }

  let startLanguage = 'de';
  let startTheme = 'light';
  try {
    startLanguage = localStorage.getItem('pocketLanguage') || 'de';
    startTheme = localStorage.getItem('pocketTheme') || 'light';
  } catch (error) {}
  if (!translations[startLanguage]) startLanguage = 'de';
  if (!['light', 'dark', 'midnight', 'ocean', 'forest'].includes(startTheme)) startTheme = 'light';
  document.getElementById('language').value = startLanguage;
  document.getElementById('theme').value = startTheme;
  setTheme(startTheme);
  setLanguage(startLanguage);
  loadData();
</script>
</body>
</html>
