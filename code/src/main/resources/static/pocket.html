<!DOCTYPE html>
<!-- Eine Datei: HTML für den Aufbau, CSS für das Design, JavaScript für die API. -->
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- Passt die Darstellung an die Bildschirmbreite an. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket – Finanzverwaltung</title>
    <style>
        /* Grundlayout mit heller Hintergrundfarbe. */
        * { box-sizing: border-box; }
        body { margin: 0; padding: 24px; font-family: Arial, sans-serif; background: #f1f5f9; color: #243247; }
        main { max-width: 1000px; margin: 25px auto; }
        /* Kopfzeile und einfache Wortmarke. */
        header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
        .logo { padding: 12px 17px; border-radius: 14px; background: #2563eb; color: white; font-size: 28px; font-weight: bold; }
        h1, h2 { margin: 0 0 10px; }
        header p { margin: 0; color: #64748b; }
        /* Weiße Karten für Login, Eingabe und Tabelle. */
        .card { background: white; border: 1px solid #e2e8f0; border-radius: 14px; padding: 24px; margin-bottom: 20px; }
        #loginView { max-width: 420px; margin: 50px auto; }
        /* Beschriftete Eingabefelder und Schaltflächen. */
        label { display: block; margin-top: 14px; font-size: 14px; font-weight: bold; }
        input, select, button { font: inherit; border-radius: 7px; padding: 11px; }
        input, select { width: 100%; margin-top: 6px; border: 1px solid #cbd5e1; }
        button { border: none; background: #2563eb; color: white; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        button:disabled { opacity: 0.6; cursor: wait; }
        .submit { margin-top: 20px; }
        .secondary { background: #e2e8f0; color: #243247; }
        .secondary:hover { background: #cbd5e1; }
        .delete { background: #b91c1c; }
        /* Zwei Spalten im Formular, auf kleinen Bildschirmen eine. */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
        .toolbar { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } body { padding: 12px; } }
        /* Breite Tabellen lassen sich seitlich scrollen. */
        .table-wrap { overflow-x: auto; margin-top: 16px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; font-size: 13px; }
        td { overflow-wrap: anywhere; }
        /* Gemeinsamer Bereich für Lade-, Erfolgs- und Fehlermeldungen. */
        #message { line-height: 1.5; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
<main>
    <!-- Logo und Titel bleiben in beiden Ansichten sichtbar. -->
    <header>
        <div class="logo" aria-hidden="true">P</div>
        <div><h1>Pocket</h1><p>Deine Transaktionen im Überblick.</p></div>
    </header>
    <p id="message" role="status"></p>

    <!-- Login: Die Zugangsdaten werden ausschließlich im Backend geprüft. -->
    <section id="loginView" class="card">
        <h2>Anmelden</h2>
        <form id="loginForm">
            <label for="email">E-Mail</label>
            <input id="email" type="email" autocomplete="username" required>
            <label for="password">Passwort</label>
            <input id="password" type="password" autocomplete="current-password" required>
            <button class="submit" type="submit">Anmelden</button>
            <button id="registerButton" class="submit secondary" type="button">Konto erstellen</button>
            <p>Neues Konto: E-Mail und Passwort mit mindestens 8 Zeichen eingeben, dann „Konto erstellen“ klicken.</p>
        </form>
    </section>

    <!-- Erst nach erfolgreicher Anmeldung anzeigen. Backend muss Zugriffe ebenfalls schützen. -->
    <div id="dashboard" hidden>
        <section class="card toolbar">
            <h2>Dashboard</h2>
            <button id="logoutButton" class="secondary" type="button">Abmelden</button>
        </section>

        <!-- Feldnamen entsprechen deiner Transaction-Entity. Die ID erzeugt das Backend. -->
        <section class="card">
            <h2>Transaktion hinzufügen</h2>
            <form id="transactionForm">
                <div class="grid">
                    <div><label for="amount">Betrag</label><input id="amount" type="number" step="0.01" required></div>
                    <div><label for="date">Datum</label><input id="date" type="date" required></div>
                    <!-- Dropdown-Werte werden unten aus den Java-Enum-Konstanten eingetragen. -->
                    <div><label for="costType">Kostenart (CostType)</label><select id="costType" required><option value="">Bitte auswählen</option></select></div>
                    <div><label for="transactionType">Transaktionsart (TransactionType)</label><select id="transactionType" required><option value="">Bitte auswählen</option></select></div>
                </div>
                <label for="notes">Notiz</label>
                <input id="notes" type="text">
                <button class="submit" type="submit">Speichern</button>
            </form>
        </section>

        <!-- Hier erscheinen ausschließlich echte Daten der API. -->
        <section class="card">
            <div class="toolbar">
                <h2>Transaktionen</h2>
                <button id="reloadButton" class="secondary" type="button">Aktualisieren</button>
            </div>
            <div class="grid" style="margin-top: 12px;">
                <div><label for="searchId">Transaktion nach ID suchen</label><input id="searchId" type="number" min="1" step="1" placeholder="z. B. 5"></div>
                <div><label for="searchName">Transaktion nach Name suchen</label><input id="searchName" type="text" placeholder="Name"></div>
                <div><label for="filterType">Nach Transaktionsart filtern</label><select id="filterType"><option value="">Alle Transaktionsarten</option></select></div>
            </div>
            <div class="toolbar" style="justify-content: flex-start; margin-top: 14px;">
                <button id="searchIdButton" class="secondary" type="button">ID suchen</button>
                <button id="searchNameButton" class="secondary" type="button">Name suchen</button>
                <button id="filterButton" class="secondary" type="button">Typ filtern</button>
                <button id="resetFilterButton" class="secondary" type="button">Alle anzeigen</button>
            </div>
            <p id="listStatus">Noch keine Daten geladen.</p>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>ID</th><th>Name</th><th>Datum</th><th>Notiz</th><th>Betrag</th><th>Kostenart</th><th>Transaktionsart</th><th>Aktion</th></tr></thead>
                    <tbody id="transactionRows"></tbody>
                </table>
            </div>
        </section>
    </div>
</main>
<script>
    "use strict";
    // Die HTML-Seite muss über Spring Boot ausgeliefert werden (gleiche Origin).
    const TRANSACTIONS_URL = "/api/transactions";
    const AUTH_URL = "/api/auth";

    const COST_TYPES = [
        ["RECURRING_REVENUE", "Regelmäßige Einnahmen"],
        ["RECURRING_EXPENSES", "Regelmäßige Ausgaben"],
        ["REVENUE", "Einnahmen"],
        ["EXPENSES", "Ausgaben"]
    ];
    const TRANSACTION_TYPES = [
        ["GEHALT", "Gehalt"], ["WOHNEN", "Wohnen"],
        ["ESSEN_TRINKEN", "Essen und Trinken"], ["MOBILITÄT", "Mobilität"],
        ["FREIZEIT", "Freizeit"], ["HOBBY", "Hobby"],
        ["SHOPPING", "Shopping"], ["BILLS", "Rechnungen"],
        ["NEBENEINKOMMEN", "Nebeneinkommen"]
    ];

    const element = id => document.getElementById(id);
    let loggedInThisPage = false;
    let currentListRequest = 0;

    function message(text) {
        element("message").textContent = text;
    }

    function fillDropdown(id, items) {
        const select = element(id);
        for (const [value, label] of items) {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = label;
            select.appendChild(option);
        }
    }
    fillDropdown("costType", COST_TYPES);
    fillDropdown("transactionType", TRANSACTION_TYPES);
    fillDropdown("filterType", TRANSACTION_TYPES);

    function showLogin() {
        loggedInThisPage = false;
        currentListRequest++;
        element("loginView").hidden = false;
        element("dashboard").hidden = true;
        element("loginForm").reset();
        element("transactionRows").replaceChildren();
        element("transactionForm").reset();
        element("listStatus").textContent = "Noch keine Daten geladen.";
    }

    function showDashboard() {
        loggedInThisPage = true;
        element("loginView").hidden = true;
        element("dashboard").hidden = false;
    }

    // Antwort auf HTTP-Status prüfen; bei Text-Fehlern nur kurze Meldung anzeigen.
    async function api(path, method = "GET", data) {
        const options = { method, credentials: "same-origin" };
        if (data !== undefined) {
            options.headers = { "Content-Type": "application/json" };
            options.body = JSON.stringify(data);
        }
        let response;
        try {
            response = await fetch(path, options);
        } catch (error) {
            throw new Error("Backend nicht erreichbar. Bitte Spring Boot starten und die Seite über http://localhost:8080/ öffnen.");
        }
        if (!response.ok) {
            const serverMessage = (await response.text().catch(() => "")).trim();
            if (response.status === 401) throw new Error("Nicht autorisiert (401). Bitte anmelden.");
            if (response.status === 404) throw new Error("Nicht gefunden (404). " + (method === "POST" && path.endsWith("/login") ? "E-Mail oder Passwort falsch." : ""));
            if (response.status === 409) throw new Error(serverMessage || "Datensatz ist bereits vorhanden (409).");
            if (response.status === 400) throw new Error(serverMessage || "Ungültige Eingaben (400).");
            throw new Error("Serverfehler (HTTP " + response.status + "). Details in der Browser-Konsole oder im Spring-Boot-Log.");
        }
        return response;
    }

    async function apiJson(path, method = "GET", data) {
        const response = await api(path, method, data);
        if (response.status === 204) return null;
        return response.json();
    }

    element("loginForm").addEventListener("submit", async function (event) {
        event.preventDefault();
        const button = this.querySelector('button[type="submit"]');
        button.disabled = true;
        try {
            await api(AUTH_URL + "/login", "POST", {
                email: element("email").value.trim(),
                password: element("password").value
            });
            element("password").value = "";
            showDashboard();
            message("Erfolgreich angemeldet.");
            await loadTransactions();
        } catch (error) {
            message(error.message);
        } finally {
            button.disabled = false;
        }
    });

    element("registerButton").addEventListener("click", async function () {
        if (!element("loginForm").reportValidity()) return;
        if (element("password").value.length < 8) {
            message("Das Passwort muss mindestens 8 Zeichen haben.");
            return;
        }
        const buttons = [...element("loginForm").querySelectorAll("button")];
        buttons.forEach(button => button.disabled = true);
        try {
            await api(AUTH_URL + "/register", "POST", {
                email: element("email").value.trim(),
                password: element("password").value
            });
            message("Konto erstellt! Du kannst dich mit denselben Daten anmelden.");
        } catch (error) {
            message(error.message);
        } finally {
            buttons.forEach(button => button.disabled = false);
        }
    });

    function formatValue(value) {
        return value === null || value === undefined || value === "" ? "–" : String(value);
    }

    function renderTransactions(transactions, description = null) {
        element("transactionRows").replaceChildren();
        element("listStatus").textContent = description || transactions.length + " Transaktionen gefunden.";
        for (const transaction of transactions) {
            const row = document.createElement("tr");
            const fields = ["id", "name", "date", "notes", "amount", "costType", "transactionType"];
            for (const field of fields) {
                const cell = document.createElement("td");
                cell.textContent = formatValue(transaction[field]);
                row.appendChild(cell);
            }
            const cell = document.createElement("td");
            const button = document.createElement("button");
            button.type = "button";
            button.className = "delete";
            button.textContent = "Löschen";
            button.disabled = transaction.id == null;
            button.addEventListener("click", () => removeTransaction(transaction.id, button));
            cell.appendChild(button);
            row.appendChild(cell);
            element("transactionRows").appendChild(row);
        }
    }

    // Alle Transaktionen: GET /api/transactions
    async function loadTransactions(path = TRANSACTIONS_URL, single = false) {
        if (!loggedInThisPage) return;
        const requestId = ++currentListRequest;
        element("reloadButton").disabled = true;
        element("listStatus").textContent = "Daten werden geladen …";
        try {
            const result = await apiJson(path);
            if (requestId !== currentListRequest || !loggedInThisPage) return;
            const transactions = single ? [result] : result;
            if (!Array.isArray(transactions)) throw new Error("Die API hat keine Transaktionsliste zurückgegeben.");
            renderTransactions(transactions);
        } catch (error) {
            if (requestId !== currentListRequest) return;
            element("listStatus").textContent = "Daten konnten nicht geladen werden.";
            message(error.message);
            console.error("Transaktionen konnten nicht geladen werden:", error);
        } finally {
            if (requestId === currentListRequest) element("reloadButton").disabled = false;
        }
    }

    element("transactionForm").addEventListener("submit", async function (event) {
        event.preventDefault();
        if (!loggedInThisPage) return;
        const button = this.querySelector('button[type="submit"]');
        button.disabled = true;
        try {
            await apiJson(TRANSACTIONS_URL + "/addTransaction", "POST", {
                amount: Number(element("amount").value),
                notes: element("notes").value.trim(),
                date: element("date").value,
                costType: element("costType").value,
                transactionType: element("transactionType").value
            });
            this.reset();
            message("Transaktion gespeichert.");
            await loadTransactions();
        } catch (error) {
            message(error.message);
            console.error("Fehler beim Speichern:", error);
        } finally {
            button.disabled = false;
        }
    });

    // DELETE /api/transactions/removeTransaction/{id}: nur die ID in die URL.
    async function removeTransaction(id, button) {
        if (!loggedInThisPage || !confirm("Transaktion " + id + " wirklich löschen?")) return;
        button.disabled = true;
        try {
            await api(TRANSACTIONS_URL + "/removeTransaction/" + encodeURIComponent(id), "DELETE");
            message("Transaktion gelöscht.");
            await loadTransactions();
        } catch (error) {
            message(error.message);
            console.error("Fehler beim Löschen:", error);
        } finally {
            button.disabled = false;
        }
    }

    element("reloadButton").addEventListener("click", () => loadTransactions());
    element("resetFilterButton").addEventListener("click", () => loadTransactions());
    element("searchIdButton").addEventListener("click", () => {
        const id = element("searchId").value.trim();
        if (!/^\d+$/.test(id) || Number(id) < 1) return message("Bitte eine gültige ID eingeben.");
        loadTransactions(TRANSACTIONS_URL + "/findTransactionbyID/" + encodeURIComponent(id), true);
    });
    element("searchNameButton").addEventListener("click", () => {
        const name = element("searchName").value.trim();
        if (!name) return message("Bitte einen Namen eingeben.");
        loadTransactions(TRANSACTIONS_URL + "/findTransactionbyName/" + encodeURIComponent(name), true);
    });
    element("filterButton").addEventListener("click", () => {
        const type = element("filterType").value;
        if (!type) return loadTransactions();
        loadTransactions(TRANSACTIONS_URL + "/findAllTransactionsbyType/" + encodeURIComponent(type));
    });

    element("logoutButton").addEventListener("click", async function () {
        this.disabled = true;
        try {
            await api(AUTH_URL + "/logout", "POST");
            showLogin();
            message("Erfolgreich abgemeldet.");
        } catch (error) {
            message(error.message);
        } finally {
            this.disabled = false;
        }
    });

    // Der aktuelle AuthController hat keinen /me-Endpunkt. Nach Neuladen
    // wird deshalb bewusst erneut das Loginformular angezeigt.
</script>
</body>
</html>
