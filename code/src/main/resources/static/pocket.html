<!DOCTYPE html>
<!-- Eine Datei: HTML für den Aufbau, CSS für das Design, JavaScript für die API. -->
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- Passt die Darstellung an die Bildschirmbreite an. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket</title>
    <style>
        /* Grundlayout mit heller Hintergrundfarbe. */
        * { box-sizing: border-box; }
        body { margin: 0; padding: 24px; font-family: Arial, sans-serif; background: #f1f5f9; color: #243247; }
        main { max-width: 1000px; margin: 25px auto; }
        /* Kopfzeile und einfache Wortmarke. */
        header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
        .logo { padding: 12px 17px; border-radius: 14px; background: #2563eb; color: white; font-size: 28px; font-weight: bold; }
        h1, h2 { margin: 0 0 10px; }
        header p { margin: 0; color: #64748b; }
        /* Weiße Karten für Login, Eingabe und Tabelle. */
        .card { background: white; border: 1px solid #e2e8f0; border-radius: 14px; padding: 24px; margin-bottom: 20px; }
        #loginView { max-width: 420px; margin: 50px auto; }
        /* Beschriftete Eingabefelder und Schaltflächen. */
        label { display: block; margin-top: 14px; font-size: 14px; font-weight: bold; }
        input, select, button { font: inherit; border-radius: 7px; padding: 11px; }
        input, select { width: 100%; margin-top: 6px; border: 1px solid #cbd5e1; }
        button { border: none; background: #2563eb; color: white; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        button:disabled { opacity: 0.6; cursor: wait; }
        .submit { margin-top: 20px; }
        .secondary { background: #e2e8f0; color: #243247; }
        .secondary:hover { background: #cbd5e1; }
        .delete { background: #b91c1c; }
        /* Zwei Spalten im Formular, auf kleinen Bildschirmen eine. */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
        .toolbar { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } body { padding: 12px; } }
        /* Breite Tabellen lassen sich seitlich scrollen. */
        .table-wrap { overflow-x: auto; margin-top: 16px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; font-size: 13px; }
        td { overflow-wrap: anywhere; }
        /* Gemeinsamer Bereich für Lade-, Erfolgs- und Fehlermeldungen. */
        #message { line-height: 1.5; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
<main>
    <!-- Logo und Titel bleiben in beiden Ansichten sichtbar. -->
    <header>
        <div class="logo" aria-hidden="true">P</div>
        <div><h1>Pocket</h1><p>Deine Transaktionen im Überblick.</p></div>
    </header>
    <p id="message" role="status"></p>

    <!-- Login: Die Zugangsdaten werden ausschließlich im Backend geprüft. -->
    <section id="loginView" class="card">
        <h2>Anmelden</h2>
        <form id="loginForm">
            <label for="email">E-Mail</label>
            <input id="email" type="email" autocomplete="username" required>
            <label for="password">Passwort</label>
            <input id="password" type="password" autocomplete="current-password" required>
            <button class="submit" type="submit">Anmelden</button>
        </form>
    </section>

    <!-- Erst nach erfolgreicher Anmeldung anzeigen. Backend muss Zugriffe ebenfalls schützen. -->
    <div id="dashboard" hidden>
        <section class="card toolbar">
            <h2>Dashboard</h2>
            <button id="logoutButton" class="secondary" type="button">Abmelden</button>
        </section>

        <!-- Feldnamen entsprechen deiner Transaction-Entity. Die ID erzeugt das Backend. -->
        <section class="card">
            <h2>Transaktion hinzufügen</h2>
            <form id="transactionForm">
                <div class="grid">
                    <div><label for="amount">Betrag</label><input id="amount" type="number" step="0.01" required></div>
                    <div><label for="date">Datum</label><input id="date" type="date" required></div>
                    <!-- Dropdown-Werte werden unten aus den Java-Enum-Konstanten eingetragen. -->
                    <div><label for="costType">Kostenart (CostType)</label><select id="costType" required><option value="">Bitte auswählen</option></select></div>
                    <div><label for="transactionType">Transaktionsart (TransactionType)</label><select id="transactionType" required><option value="">Bitte auswählen</option></select></div>
                </div>
                <label for="notes">Notiz</label>
                <input id="notes" type="text">
                <button class="submit" type="submit">Speichern</button>
            </form>
        </section>

        <!-- Hier erscheinen ausschließlich echte Daten der API. -->
        <section class="card">
            <div class="toolbar">
                <h2>Transaktionen</h2>
                <button id="reloadButton" class="secondary" type="button">Aktualisieren</button>
            </div>
            <p id="listStatus">Noch keine Daten geladen.</p>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>ID</th><th>Datum</th><th>Notiz</th><th>Betrag</th><th>Kostenart</th><th>Transaktionsart</th><th>Aktion</th></tr></thead>
                    <tbody id="transactionRows"></tbody>
                </table>
            </div>
        </section>
    </div>
</main>
<script>
    // API-MAPPING: Gleicher Server wie diese HTML-Datei; deshalb keine feste localhost-Adresse.
    // Datei in src/main/resources/static/pocket.html ablegen und über Spring Boot öffnen.
    const BASE_URL = "";
    const TRANSACTIONS_URL = "/api/transactions";

    // NOCH EINTRAGEN: Diese beiden Endpunkte existieren in deinem Controller bisher nicht.
    // Login-Vertrag: POST mit {email, password}; 2xx nur bei gültigen Zugangsdaten.
    // Das Backend erstellt dabei eine Session mit Cookie; falsche Zugangsdaten ergeben 401.
    // Logout-Vertrag: POST, Session im Backend beenden, danach 2xx zurückgeben.
    const LOGIN_URL = "";
    const LOGOUT_URL = "";

    // Kurze Hilfsfunktion, damit HTML-Elemente einfacher angesprochen werden können.
    function element(id) { return document.getElementById(id); }

    // Exakte Java-Enum-Konstanten als API-Werte, deutsche Texte für die Anzeige.
    const COST_TYPES = [
        ["RECURRING_REVENUE", "Regelmäßige Einnahmen"],
        ["RECURRING_EXPENSES", "Regelmäßige Ausgaben"],
        ["REVENUE", "Einnahmen"],
        ["EXPENSES", "Ausgaben"]
    ];
    const TRANSACTION_TYPES = [
        ["GEHALT", "Gehalt"], ["WOHNEN", "Wohnen"],
        ["ESSEN_TRINKEN", "Essen und Trinken"], ["MOBILITÄT", "Mobilität"],
        ["FREIZEIT", "Freizeit"], ["HOBBY", "Hobby"],
        ["SHOPPING", "Shopping"], ["BILLS", "Rechnungen"],
        ["NEBENEINKOMMEN", "Nebeneinkommen"]
    ];

    // Erzeugt die auswählbaren Optionen ohne zusätzliche Bibliothek.
    function fillDropdown(id, values) {
        const select = element(id);
        select.options[0].textContent = values.length ? "Bitte auswählen" : "Bitte auswählen";
        for (const [value, label] of values) {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = label;
            select.appendChild(option);
        }
    }
    fillDropdown("costType", COST_TYPES);
    fillDropdown("transactionType", TRANSACTION_TYPES);

    // Statusmeldungen sicher als Text anzeigen.
    function message(text) { element("message").textContent = text; }

    // Lokale Anzeige zurücksetzen; beendet allein noch keine Backend-Session.
    function showLogin() {
        element("dashboard").hidden = true;
        element("loginView").hidden = false;
        element("transactionRows").replaceChildren();
        element("transactionForm").reset();
        element("loginForm").reset();
    }

    // Gemeinsamer API-Aufruf: JSON senden, Session-Cookie mitsenden und HTTP-Fehler prüfen.
    async function request(path, method = "GET", data) {
        const options = { method: method, credentials: "same-origin" };
        if (data !== undefined) {
            options.headers = { "Content-Type": "application/json" };
            options.body = JSON.stringify(data);
        }
        // Falls Spring Security CSRF verwendet, hier dessen Token als Header ergänzen.
        const response = await fetch(BASE_URL + path, options);
        if (response.status === 401) {
            showLogin();
            throw new Error("Anmeldung erforderlich oder Zugangsdaten ungültig.");
        }
        if (!response.ok) throw new Error("Anfrage fehlgeschlagen (HTTP " + response.status + ").");
        return response;
    }

    // Login absenden. Kein Passwortvergleich im Browser und keine Passwortspeicherung.
    element("loginForm").addEventListener("submit", async function(event) {
        event.preventDefault();
        if (!LOGIN_URL) return message("Bitte zuerst den Login-Endpunkt im JavaScript eintragen und im Backend implementieren.");
        const button = this.querySelector("button");
        button.disabled = true;
        try {
            await request(LOGIN_URL, "POST", {
                email: element("email").value.trim(),
                password: element("password").value
            });
            element("password").value = "";
            element("loginView").hidden = true;
            element("dashboard").hidden = false;
            message("Angemeldet.");
            await loadTransactions();
        } catch (error) { message(error.message); }
        finally { button.disabled = false; }
    });

    // Alle vom Backend freigegebenen Transaktionen laden und als Tabelle anzeigen.
    async function loadTransactions() {
        element("reloadButton").disabled = true;
        element("transactionRows").replaceChildren();
        element("listStatus").textContent = "Daten werden geladen …";
        try {
            const response = await request(TRANSACTIONS_URL);
            const transactions = await response.json();
            if (!Array.isArray(transactions)) throw new Error("Die API muss eine Liste von Transaktionen zurückgeben.");
            element("listStatus").textContent = transactions.length + " Transaktionen gefunden.";
            for (const transaction of transactions) {
                const row = document.createElement("tr");
                // textContent verhindert, dass Notizen als HTML ausgeführt werden.
                const values = [transaction.id, transaction.date, transaction.notes,
                    transaction.amount, transaction.costType, transaction.transactionType];
                for (const value of values) {
                    const cell = document.createElement("td");
                    cell.textContent = value ?? "–";
                    row.appendChild(cell);
                }
                // Jeder Datensatz erhält einen eigenen Löschbutton.
                const cell = document.createElement("td");
                const button = document.createElement("button");
                button.type = "button";
                button.className = "delete";
                button.textContent = "Löschen";
                button.addEventListener("click", () => removeTransaction(transaction, button));
                cell.appendChild(button);
                row.appendChild(cell);
                element("transactionRows").appendChild(row);
            }
        } catch (error) {
            element("listStatus").textContent = "Daten konnten nicht geladen werden.";
            message(error.message);
        } finally { element("reloadButton").disabled = false; }
    }

    // Neue Transaktion mit genau den Feldern deiner Entity als JSON senden.
    element("transactionForm").addEventListener("submit", async function(event) {
        event.preventDefault();
        const button = this.querySelector("button");
        button.disabled = true;
        try {
            await request(TRANSACTIONS_URL + "/addTransaction", "POST", {
                amount: Number(element("amount").value),
                notes: element("notes").value.trim(),
                date: element("date").value,
                costType: element("costType").value.trim(),
                transactionType: element("transactionType").value.trim()
            });
            this.reset();
            message("Transaktion gespeichert.");
            await loadTransactions();
        } catch (error) { message(error.message); }
        finally { button.disabled = false; }
    });

    // Dein DELETE-Endpunkt erwartet nach der Korrektur einen Transaction-Body.
    async function removeTransaction(transaction, button) {
        if (!confirm("Transaktion wirklich löschen?")) return;
        button.disabled = true;
        try {
            await request(TRANSACTIONS_URL + "/removeTransaction", "DELETE", transaction);
            message("Transaktion gelöscht.");
            await loadTransactions();
        } catch (error) { message(error.message); }
        finally { button.disabled = false; }
    }

    // Manuelles Neuladen der Tabelle.
    element("reloadButton").addEventListener("click", loadTransactions);

    // Erst die Backend-Session beenden, dann wieder das Loginfenster anzeigen.
    element("logoutButton").addEventListener("click", async function() {
        if (!LOGOUT_URL) return message("Bitte zuerst den Logout-Endpunkt im JavaScript eintragen und im Backend implementieren.");
        this.disabled = true;
        try {
            await request(LOGOUT_URL, "POST");
            showLogin();
            message("Abgemeldet.");
        } catch (error) { message(error.message); }
        finally { this.disabled = false; }
    });
</script>
</body>
</html>
